name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CommerceLab.slnx

      - name: Build
        run: dotnet build CommerceLab.slnx --configuration Release --no-restore 

      - name: Run tests
        run: dotnet test CommerceLab.slnx --configuration Release --no-build          