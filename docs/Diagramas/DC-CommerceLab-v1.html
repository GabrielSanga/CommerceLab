<div id="cd3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('cd3-svg', `classDiagram
direction TB

note "Opaco: implementado e persistido no schema catalogo. Esmaecido: modelo previsto, ainda sem código nem tabela. Só constam operações que existem no domínio."

class Produto {
  +UUID id
  +string nome
  +string descricao
  +string sku
  +decimal preco
  +boolean ativo
  +datetime criadoEm
  +datetime atualizadoEm
  +Criar(nome, descricao, sku, preco) Result~Produto~$
}
class Estoque {
  +UUID id
  +UUID produtoId
  +int quantidadeDisponivel
  +int quantidadeReservada
  +datetime atualizadoEm
  +Criar(produtoId, quantidadeInicial) Result~Estoque~$
}

class Cliente {
  +UUID id
  +string nome
  +string email
  +string documento
  +datetime criadoEm
}
class Endereco {
  +UUID id
  +string logradouro
  +string numero
  +string cidade
  +string uf
  +string cep
}
class Pedido {
  +UUID id
  +string numero
  +datetime dataCriacao
  +PedidoStatus status
  +decimal valorTotal
}
class ItemPedido {
  +UUID id
  +int quantidade
  +decimal precoUnitario
}
class PedidoStatus {
  <<enumeration>>
  CRIADO
  AGUARDANDO_PAGAMENTO
  PAGO
  ENVIADO
  ENTREGUE
  CANCELADO
}

Estoque "1" --> "1" Produto : produto_id, FK com índice único

Cliente "1" --> "0..*" Endereco
Cliente "1" --> "0..*" Pedido : realiza
Pedido "1" *-- "1..*" ItemPedido
Pedido "0..*" --> "1" Endereco : entrega
ItemPedido "0..*" --> "1" Produto
Pedido ..> PedidoStatus

cssClass "Cliente,Endereco,Pedido,ItemPedido,PedidoStatus" planejado
`);
document.getElementById('cd3').innerHTML = svg;
const estilo = document.createElement('style');
estilo.textContent = '#cd3 g.planejado { opacity: .45; } #cd3 g.planejado rect, #cd3 g.planejado path { stroke-dasharray: 5 4; }';
document.getElementById('cd3').appendChild(estilo);
</script>
