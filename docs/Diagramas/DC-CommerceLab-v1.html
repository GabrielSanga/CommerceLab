<div id="cd3"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('cd3-svg', `classDiagram
direction TB

note "Todas as entidades estão implementadas e persistidas (schemas catalogo, cliente e venda). Só constam operações que existem no domínio."

class Produto {
  +UUID id
  +string nome
  +string descricao
  +string sku
  +decimal preco
  +boolean ativo
  +datetime criadoEm
  +datetime atualizadoEm
  +Criar(nome, descricao, sku, preco) Result~Produto~$
}
class Estoque {
  +UUID id
  +UUID produtoId
  +int quantidadeDisponivel
  +int quantidadeReservada
  +datetime atualizadoEm
  +Criar(produtoId, quantidadeInicial) Result~Estoque~$
}

class Cliente {
  +UUID id
  +string nome
  +string email
  +string documento
  +datetime criadoEm
  +Criar(nome, email, documento) Result~Cliente~$
  +AdicionarEndereco(logradouro, numero, cidade, estado, cep) Result~Endereco~
}
class Endereco {
  +UUID id
  +string logradouro
  +string numero
  +string cidade
  +string estado
  +string cep
}
class Pedido {
  +UUID id
  +string codigo
  +UUID idCliente
  +UUID idEndereco
  +PedidoStatus status
  +decimal valorTotal
  +datetime dataCriacao
  +Criar(idCliente, idEndereco) Result~Pedido~$
  +AdicionarItem(idProduto, nomeProduto, sku, quantidade, valorUnitario) Result~PedidoItem~
}
class PedidoItem {
  +UUID id
  +UUID idPedido
  +UUID idProduto
  +string nomeProduto
  +string sku
  +int quantidade
  +decimal valorUnitario
  +decimal subtotal
  +Criar(idPedido, idProduto, nomeProduto, sku, quantidade, valorUnitario) Result~PedidoItem~$
}
class PedidoStatus {
  <<enumeration>>
  CRIADO
  AGUARDANDO_PAGAMENTO
  PAGO
  ENVIADO
  ENTREGUE
  CANCELADO
}

Estoque "1" --> "1" Produto : produto_id, FK com índice único

Cliente "1" --> "0..*" Endereco
Cliente "1" --> "0..*" Pedido : realiza
Pedido "1" *-- "1..*" PedidoItem
Pedido "0..*" --> "1" Endereco : entrega
PedidoItem "0..*" --> "1" Produto
Pedido ..> PedidoStatus
`);
document.getElementById('cd3').innerHTML = svg;
</script>
